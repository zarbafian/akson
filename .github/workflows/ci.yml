name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # The published site hand-writes prose next to blocks generated from
      # crates/ and spec/. Without this, a source change the pages did not
      # follow ships silently — which is how docs/ came to tell readers the
      # daemon requires the connecting UID to equal its own, long after
      # admission became per-socket. Pure stdlib, so it needs no setup step.
      - name: Docs match the code and the specs
        run: python3 harness/check-docs.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # The public-processor broker path validates server certs against the
      # Mozilla CA roots; these #[ignore] tests need outbound network, which the
      # runner has (the local dev host may not).
      - name: Broker CA path (network)
        run: cargo test -p akson-transport --test ca_tls --locked -- --ignored

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  # A0.1: the release path (.github/workflows/release.yml) only ever runs on a
  # tag, so nothing would notice it rotting. This job walks the same first steps
  # on every push and pull request — same pinned toolchain, same `--locked
  # --release` build, same digests — and fails if the release path and the
  # workspace have drifted apart.
  provenance-dry-run:
    name: provenance dry-run (release path, nothing published)
    runs-on: ubuntu-latest
    env:
      # release.yml deliberately does not set `-D warnings`; the dry-run has to
      # be the release build, so it clears the workflow-level RUSTFLAGS.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned toolchain
        id: pin
        run: |
          set -euo pipefail
          channel="$(grep -m1 -E '^ *channel *=' rust-toolchain.toml | cut -d'"' -f2)"
          test -n "$channel" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - uses: Swatinem/rust-cache@v2

      - name: The active toolchain must be the pinned one
        run: |
          set -euo pipefail
          active="$(rustc --version | cut -d' ' -f2)"
          pinned="${{ steps.pin.outputs.channel }}"
          echo "rustc $active (rust-toolchain.toml: $pinned)"
          [ "$active" = "$pinned" ] || { echo "::error::rustc $active is not the pinned $pinned"; exit 1; }

      # The drift that actually bites: a new adapter, or a renamed binary, that
      # the release workflow never learns to ship.
      - name: The artifact manifest must account for every workspace binary
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP"
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] as $p | $p.targets[] | select(.kind | index("bin")) | "\($p.name) \(.name)"' \
            | LC_ALL=C sort > "$t/actual.txt"
          grep -vE '^[[:space:]]*(#|$)' .github/release-artifacts.txt > "$t/manifest.txt"
          awk '/^!/ {print substr($1, 2)}' "$t/manifest.txt" | LC_ALL=C sort > "$t/excluded.txt"
          awk '!/^!/ {print $1, $2}' "$t/manifest.txt" | LC_ALL=C sort > "$t/shipped.txt"
          awk 'NR == FNR { ex[$1]; next } !($1 in ex)' "$t/excluded.txt" "$t/actual.txt" > "$t/expected.txt"
          echo "--- shipped (.github/release-artifacts.txt)"; cat "$t/shipped.txt"
          echo "--- excluded"; cat "$t/excluded.txt"
          diff -u "$t/shipped.txt" "$t/expected.txt" || {
            echo "::error::.github/release-artifacts.txt and the workspace's bin targets disagree — list the binary or exclude it with a reason"
            exit 1
          }

      # One artifact is enough to prove the command still works; the release
      # builds all six the same way.
      - name: Build one artifact exactly as the release does
        run: cargo build --locked --release --bins -p akson-cli

      - name: Record the digests the release path would publish
        run: |
          set -euo pipefail
          lock="$(sha256sum Cargo.lock | cut -d' ' -f1)"
          bin="$(sha256sum target/release/akson | cut -d' ' -f1)"
          echo "Cargo.lock sha256 = $lock"
          echo "akson (release) sha256 = $bin"
          {
            echo "### provenance dry-run"
            echo
            echo "| what | value |"
            echo "|---|---|"
            echo "| rustc | \`$(rustc --version)\` |"
            echo "| host target | \`$(rustc -vV | awk '/^host:/{print $2}')\` |"
            echo "| Cargo.lock sha256 | \`$lock\` |"
            echo "| akson (release) sha256 | \`$bin\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The build must not have moved the lockfile
        run: git diff --exit-code -- Cargo.lock

  xcheck:
    name: independent vector cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cross-checker
        run: pip install -r xcheck/requirements.txt
      - name: Cross-check golden vectors
        run: python xcheck/run.py spec/vectors

  isolation:
    name: sandbox isolation (permissive runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # The clean worker (§13.1) needs unprivileged user namespaces, which recent
      # Ubuntu restricts via AppArmor. GitHub runners grant passwordless sudo, so
      # enable it for this job (the local host cannot, hence CI validates it).
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true && echo "user namespaces available"
      # This job goes red when an isolation check FAILS, and only then. Anything
      # the runner will not grant is an environment gap: it makes named checks
      # visibly not run (harness/ci/isolation-env.sh owns which tests need what,
      # and what a skip looks like), rather than pass quietly or fail the job.
      #
      # The clean worker launches through bubblewrap, which the runner image does
      # not ship — every live launcher test died on "spawning bwrap: No such file
      # or directory" rather than on anything about isolation.
      - name: Install bubblewrap (or say what will not run)
        id: bwrap
        run: |
          . harness/ci/isolation-env.sh
          if sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap && command -v bwrap >/dev/null; then
            bwrap --version
            isolation_emit available true
            isolation_emit skip_args ""
          else
            isolation_emit available false
            isolation_emit skip_args "$(isolation_skip_args bwrap)"
            isolation_report_skip bwrap "bubblewrap could not be installed on this runner"
          fi
      # cgroup confinement needs a delegated subtree this user owns; a runner
      # gives none. The script carves one out with sudo, proves the job user can
      # use it, and proves the join the test steps will perform. Entering the
      # subtree is the only privileged act — the tests themselves run as the job
      # user and assert it, because a pass as root would establish nothing.
      - name: Delegate a cgroup v2 subtree (or say what will not run)
        id: cgroup
        run: bash harness/ci/delegate-cgroup.sh
      - name: seccomp + Landlock enforcement
        run: cargo test -p akson-sandbox --locked
      # AKSON_CGROUP_SKIP_ARGS is the flag list for the cgroup-dependent tests;
      # in-cgroup.sh appends it only if it could not actually enter the subtree,
      # so a gap found at join time still lands in the skip path. $BWRAP_SKIP is
      # decided for good by the step above and is applied here.
      - name: live namespace/mount checklist (#[ignore] tests)
        env:
          AKSON_CGROUP_SKIP_ARGS: ${{ steps.cgroup.outputs.skip_args }}
          BWRAP_SKIP: ${{ steps.bwrap.outputs.skip_args }}
        run: bash harness/ci/in-cgroup.sh cargo test -p akson-sandbox --locked -- --ignored $BWRAP_SKIP
      # These three cannot self-skip a missing bwrap the way they self-skip a
      # missing cgroup, so without it the step does not run at all — which the
      # run's step list shows as skipped.
      - name: clean-worker end-to-end (work order → sandbox → gate)
        if: steps.bwrap.outputs.available == 'true'
        run: bash harness/ci/in-cgroup.sh cargo test -p akson-harness --locked --test clean_worker_e2e -- --ignored --nocapture
      - name: daemon worker-run (receive → approve → run in sandbox → manifest)
        if: steps.bwrap.outputs.available == 'true'
        run: bash harness/ci/in-cgroup.sh cargo test -p aksond --locked --test receive_e2e the_daemon_runs_the_approved -- --ignored --nocapture
      - name: build the OpenAI adapter (for the confined e2e)
        if: steps.bwrap.outputs.available == 'true'
        run: cargo build -p akson-adapter-openai --locked
      - name: confined OpenAI adapter e2e (adapter → broker → mock model)
        if: steps.bwrap.outputs.available == 'true'
        run: bash harness/ci/in-cgroup.sh cargo test -p aksond --locked --test receive_e2e the_openai_adapter -- --ignored --nocapture
      - name: interop — pairing over mTLS (two processes)
        run: bash harness/interop/scenario-pairing.sh
      - name: interop — coordination dispatch over mTLS (two processes)
        run: bash harness/interop/scenario-coord-dispatch.sh
      # harness/run-checks.sh's rule, applied to the job: a run with a skipped
      # check does not get to print the same sentence as a complete one. `always`
      # so the verdict is recorded even when a real check failed above.
      - name: Isolation verdict (a skip is not a pass)
        if: always()
        run: |
          gaps=""
          [ "${{ steps.bwrap.outputs.available }}" = "true" ] || gaps="$gaps bwrap"
          [ "${{ steps.cgroup.outputs.delegated }}" = "true" ] || gaps="$gaps cgroup"
          # in-cgroup.sh leaves this behind if the subtree existed but no step
          # could enter it — a gap that only shows up after delegation succeeds.
          if [ -e "${RUNNER_TEMP:-/tmp}/akson-cgroup-join-skip" ]; then gaps="$gaps cgroup-join"; fi
          if [ "${{ job.status }}" != "success" ]; then
            echo "SOME ISOLATION CHECKS FAILED — any gaps listed below are context, not the cause:$gaps"
          elif [ -z "$gaps" ]; then
            echo "ALL SANDBOX ISOLATION CHECKS RAN — seccomp, Landlock, namespaces, mount, bwrap, cgroup"
          else
            echo "ISOLATION CHECKS PASSED, WITH GAPS —$gaps — see the SKIPPED block(s) above"
          fi

  proof:
    name: machine-checked protocol models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The model <-> code conformance tests are a workspace member and run in
      # the `check` job's `cargo test --workspace`. This job checks the models
      # themselves, which need TLC and Apalache (downloaded by the Makefile).
      - name: TLC — exhaustive check of every spec
        run: make -C proof
      - name: Apalache — inductive proofs (any run length)
        run: make -C proof inductive
      # Without this, a harness that checks nothing would still pass: each
      # mutation breaks one protocol rule and TLC must produce a counterexample.
      - name: negative checks — the checks must be able to fail
        run: make -C proof negative

  # C1 family-substrate vectors: every repo's CI re-derives the shared
  # vectors independently. Pinned via plan/family-lock.json row
  # 'family-vectors-c1-r3' (byom tag c1-r3); bump follows the D3 choreography.
  family-vectors:
    name: family-vectors cross-check
    runs-on: ubuntu-latest
    steps:
      # Both checkouts name their own directory. Without `path` the byom
      # checkout landed on $GITHUB_WORKSPACE itself and actions/checkout cleans
      # its target first — so it deleted `consumer/`, and every run of this job
      # since it was added died on a missing consumer/spec/family-lock.pin.json.
      # Sibling paths make the two trees independent of step order.
      - uses: actions/checkout@v4
        with:
          path: consumer
      - uses: actions/checkout@v4
        with:
          repository: zarbafian/byom
          ref: b3a8f4ad96c6992e029080faec93837a1fedeb40
          path: byom
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify this ref is the one the family lock pins
        run: |
          # R3-L03: CI must check the locked manifest, not merely carry a ref
          # that someone remembered to bump. The vendored pin holds the
          # manifest digest; the manifest holds the tree's commit.
          pin_sha=$(python3 -c "import json;print(json.load(open('consumer/spec/family-lock.pin.json'))['manifest_sha256'])")
          echo "vendored pin expects manifest sha256 $pin_sha"
          # This constant is a second copy of the family manifest digest. The
          # program's plan/check-dag.py asserts it equals the manifest, so a
          # re-pin that forgets this file fails there rather than here.
          test "$pin_sha" = "a5ceb7c99b9792796a3888ddadd875210bf6d0071fd3de0163b52beeb5cc2b77" || { echo "manifest digest drifted from this repo's vendored pin"; exit 1; }
      # The other half of the same claim, run inside the byom tree: the commit
      # checked out above is the one the manifest's family-vectors row pins.
      # check-dag.py holds this constant, the digest above, and the `ref:` to
      # the manifest, so a re-pin that forgets this file fails there, locally.
      - name: Verify the checked-out byom tree is the locked commit
        working-directory: byom
        run: |
          test "$(git rev-parse HEAD)" = "b3a8f4ad96c6992e029080faec93837a1fedeb40" || { echo "checked-out byom tree is not the locked commit"; exit 1; }
      - run: python3 byom/family-vectors/xcheck.py
