# Akson fleet identities (A0.5). The daemon and the coordination driver are
# separate system users so the C4 coordination socket's admission rule
# (AKSON_COORD_UID) is an OS access domain, not just a token check.
u akson      - "Akson daemon"                /var/lib/akson -
u akson-coord - "Akson coordination driver"  -              -
